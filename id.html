<script type="module">
import { ID_KOOP, ID_NEUTRAL, ID_POOK } from "./ID.js";

function showID(mode) {
    const map = {
        koop: ID_KOOP,
        neutral: ID_NEUTRAL,
        pook: ID_POOK
    };
    const id = map[mode];
    document.getElementById("id-info").innerText = id.info();
}
</script>
