<script type="module">
import { SYS_FIND_KOOP_POOK } from "../sys/SYS.js";

async function loadRESPO() {
    const res = await fetch("../sys/respo-funktion-6.csv");
    const text = await res.text();
    const lines = text.trim().split("\n").slice(1);

    window.RESPO_LIST = lines.map(line => {
        const [key, func, connect] = line.split(",");
        return { key, func, "Connect‑Fähigkeit": connect };
    });
}

loadRESPO();
</script>
